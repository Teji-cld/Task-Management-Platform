# Goes into the image at /etc/nginx/conf.d/ (replacing default.conf).
# "backend" below must match the backend service name in your compose.yaml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The React app. If no file matches the URL, fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite gives built files in /assets/ unique names, so browsers can cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API. No path after the port in proxy_pass, so /api/tasks reaches the backend as /api/tasks.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend endpoints that live outside /api: health check and interactive docs.
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}